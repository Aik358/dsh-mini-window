<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'" />
<title>DSH</title>
<style>
  /* 借鉴参考实现桌面悬浮球：纯透明底 + 圆形按钮 + 悬停放大 + 拖动缩小
     —— 但配色走 DSH 的黑白，且默认直径比参考实现小一档。
     上一版的问题：球体本身是 64px 且带实心深色底，显得又大又"贴了一块黑胶布"。
     这一版把**窗口**压到 44px、**视觉球体** 36px，其余全是透明区域。 */
  :root {
    --win: 44px;      /* 窗口边长（含透明外圈） */
    --ball: 36px;     /* 可见球体直径 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: var(--win); height: var(--win);
    background: transparent !important;
    overflow: hidden;
  }
  /* ★ 命中区修正（2026-10-11）：原来 `#ball` 只有 36px 而窗口 44px，
   *   四周各 4px 是 alpha=0 的透明边 —— 鼠标落在那里会**穿透到桌面**，
   *   表现为「球明明在，但边缘拖不动/点不动」。
   *   现在让 `#ball` 撑满整个窗口（44px），视觉球体靠 `::after` 画 36px 圆，
   *   于是**整窗都是命中区**，不再有"差几像素就点不到"的问题。 */
  body { display: block; user-select: none; -webkit-user-select: none; }

  #ball {
    width: var(--win); height: var(--win);       /* 命中区 = 整窗 */
    border-radius: 50%;
    display: grid; place-items: center;
    cursor: grab;
    position: relative;
    background: transparent;                      /* 由 ::after 负责视觉 */
    border: none;
  }
  /* 视觉球体：36px 圆形，居中 */
  #ball::after {
    content: '';
    position: absolute;
    width: var(--ball); height: var(--ball);
    border-radius: 50%;
    background: rgba(28, 30, 33, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.20);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.42);
    transition: background 160ms ease, border-color 160ms ease,
                box-shadow 160ms ease, transform 160ms cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  #ball:hover::after {
    background: rgba(42, 45, 49, 0.95);
    border-color: rgba(255, 255, 255, 0.34);
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.5);
    transform: scale(1.06);
  }
  #ball.dragging::after {
    transform: scale(0.94);
    background: rgba(58, 62, 68, 0.96);
    border-color: rgba(255, 255, 255, 0.42);
    transition: none;
  }
  #ball:active { cursor: grabbing; }
  @media (prefers-color-scheme: light) {
    #ball::after {
      background: rgba(250, 250, 252, 0.88);
      border-color: rgba(0, 0, 0, 0.18);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
    }
    #ball:hover::after {
      background: rgba(255, 255, 255, 0.98);
      border-color: rgba(0, 0, 0, 0.28);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.22);
    }
  }

  /* logo 必须在 ::after 之上 */
  #logo { position: relative; z-index: 1; }

  /* 拖动手感：整个窗口都是热区，但只有球体可见 */
  body { cursor: grab; }
  body.dragging { cursor: grabbing; }

  #logo {
    width: 22px; height: 22px;
    display: block;
    pointer-events: none;
    /* 深色底用白 logo，浅色底用黑 logo —— 靠 CSS 变量切换 */
    color: #ffffff;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
  }
  @media (prefers-color-scheme: light) {
    #logo { color: #0f1115; filter: drop-shadow(0 1px 1px rgba(255,255,255,.5)); }
  }

  /* 状态点：只在悬停时出现。
     理由：未握手状态在没有插件配合时会长期存在，常驻一个橙点会让球看起来很脏。
     改为悬停才提示 —— 平时是一颗干净的鲸鱼。 */
  #dot {
    position: absolute;
    right: 0; bottom: 0;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f0a020;
    opacity: 0;
    transition: opacity 180ms ease;
  }
  #dot.on { opacity: 0; }
  #dot.ok { display: none; }          /* 正常连接时彻底不显示 */
  body:hover #dot.on { opacity: 1; }  /* 只有鼠标移上去才提示 */
</style>
</head>
